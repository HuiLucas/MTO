run:
  case: app
  solver: MTO_TF
  parallel: 10
  postprocess: postProcess
  skip_clean: false
  iters: 100
geometry:
  origin_mm:
  - 0.0
  - 0.0
  - 0.0
  size_mm:
  - 15.0
  - 15.0
  - 20.0
  cells:
  - 110
  - 110
  - 146
  flow_axis: z
  encap_wall_mm: 3
  encap_open_faces:
  - zmin
  - zmax
inlet:
  face: min
  window_origin_mm:
  - 1.0
  - 1.0
  window_size_mm:
  - 1.0
  - 1.5
  velocity_magnitude: 0.1
  temperature: 380.0
outlet:
  face: max
  window_origin_mm:
  - 12.0
  - 12.0
  window_size_mm:
  - 1.0
  - 1.5
  pressure: 0.0
material:
  nu: 1.0e-06
  alpha_max: 5.0e6
  mma_init: 0.5
  mma_dec: 0.7
  mma_inc: 1.2
  movlim: 0.4
  voluse: 0.2
  filter_radius: 2.0
  solid_area: 0.0
  fluid_area: 1.0
  test_pd: 0.0
  d_normalization: 1.0e-09
  d0: 160.0
  d1: 150.0
  geo_dim: 3.0
  b1: 1.0
  qu: 0.005
  kf: 0.61
  ks: 237.0
  rhoc: 4180000.0
  t_alpha: 2.0e-05
  solid_density_g_per_mm3: 0.0027
  darcy_number: 1.0e-9
  rho_fluid: 1000.0
  hconv: 1000.0
  Texterior: 270.0
thermal:
  initial_temperature: 270.0
turbulence:
  simulation_type: laminar
  ras_model: laminar
  turbulence: false
  print_coeffs: false
optimization:
  method: MMA
  unit: 1.8
  wall: 0.2
  epsilon: 0.2
  spacing: 7.0
  bake_spacing: 1.4
  kbound: 3.4
  mode: pressure
  meantT_max: 303
  dissPower_max: 9800.0
  mu_penalty: 10000.0
  am_theta: 45.0
  am_P_bar: 0.01
  mu_overhang: 8.1e7   # scaled up ~1e4x from the old mean-of-squares value to compensate for m_vox^p_agg shrinkage at am_overhang_p=6
  am_L_bridge: 1.5   # LPBF self-supporting bridge length (mm); erosion radius = L_bridge/2
  am_overhang_p: 6.0   # Lp-norm exponent for overhang penalty's voxel aggregation (2 = mean-of-squares; >2 = worst-voxel hotspots dominate)
  build_direction:
  - 1
  - 1
  - 1
  am_align_build_to_flow: true
  no_overhang: false
  pareto_enabled: false
  pareto_weights: null
  pareto_n_weights: 9
  pareto_iters_per_point: 30
  pareto_warmstart: true
