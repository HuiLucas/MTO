syntax = "proto3";

package gyroid;

// ─── Shared ──────────────────────────────────────────────────────────────────

message Empty {}

// ─── Configuration ───────────────────────────────────────────────────────────

message ConfigResponse {
  string yaml_content = 1;
  bool   success      = 2;
  string error        = 3;
}

// Replace the entire YAML config on disk.
message SetConfigRequest {
  string yaml_content = 1;
}

// Patch individual values using dot-notation keys (JSON encoded).
// Example JSON: {"run.iters": 30, "optimization.mode": "heat"}
// Note: comments in the YAML file will be lost on patch.
message PatchConfigRequest {
  string json_patch = 1;
}

message StatusResponse {
  bool   success = 1;
  string message = 2;
}

// ─── Run control ─────────────────────────────────────────────────────────────

message StartRunRequest {
  // Extra CLI flags forwarded verbatim to gyroid_case_wrapper.py.
  // Example: ["--restart", "--iters", "40"]
  repeated string extra_args = 1;
}

message RunStatusResponse {
  enum State {
    IDLE    = 0;
    RUNNING = 1;
    DONE    = 2;
    ERROR   = 3;
  }
  State  state       = 1;
  int32  pid         = 2;
  string message     = 3;
  int32  return_code = 4;
}

// ─── Output streaming ────────────────────────────────────────────────────────

message OutputLine {
  string line         = 1;
  bool   is_stderr    = 2;
  int64  timestamp_ms = 3;
}

// ─── Optimization history ────────────────────────────────────────────────────

// One row from gyroid_opt_history.txt.
// Numeric columns (and "nan") go into `values`; pure strings (e.g. "pressure")
// go into `strings`.
message HistoryRow {
  map<string, double> values  = 1;
  map<string, string> strings = 2;
}

message HistoryResponse {
  bool             success = 1;
  string           error   = 2;
  repeated string  columns = 3;
  repeated HistoryRow rows = 4;
}

message LatestMetricsResponse {
  bool       available = 1;
  HistoryRow latest    = 2;
  string     error     = 3;
}

// ─── File access ─────────────────────────────────────────────────────────────

// Path is relative to the `app/` directory. Empty path = the whole app dir.
message ListFilesRequest {
  string path = 1;
}

message FileListResponse {
  repeated string paths = 1;
  bool            success = 2;
  string          error   = 3;
}

// Download a single file or a directory archive.
message DownloadRequest {
  // Relative path inside app/. Empty = whole app dir.
  string path   = 1;
  // When true (or when path points to a directory), the response is a
  // gzip-compressed tar archive of the requested path.
  bool   as_tar = 2;
}

message FileChunk {
  bytes  data       = 1;
  string filename   = 2;  // Base name of the file or archive
  int64  total_size = 3;  // Total bytes of the full file/archive
  bool   is_last    = 4;
}

// ─── STL export ──────────────────────────────────────────────────────────────

// Start gyroid_to_stl.py with optional extra CLI flags.
// If extra_args is empty the script uses its own defaults (reads the YAML config).
// Example extra_args: ["--res", "0.015", "--mirror-y"]
message StlExportRequest {
  repeated string extra_args = 1;
}

// Which STL file to download.
//   "lattice"  → gyroid_surface_lattice.stl  (gyroid wall mesh)
//   "encap"    → gyroid_surface_encap.stl    (encapsulation shell)
//   "surface"  → gyroid_surface.stl          (combined, when no encap)
//   "all"      → tar.gz of all gyroid_surface*.stl files next to the script
// Defaults to "lattice" when empty.
message StlFileRequest {
  string which = 1;
}

// ─── Gyroid-to-quad-mesh ─────────────────────────────────────────────────────

// Start gyroid_to_quad_mesh_qf.py with optional extra CLI flags.
// Default output: gyroid_implicit_qf_plus.obj / gyroid_implicit_qf_minus.obj
message QuadMeshRequest {
  repeated string extra_args = 1;
}

// ─── Quad-to-NURBS (STEP export) ─────────────────────────────────────────────

// Start quad_to_nurbs.py for one gyroid sheet.
//   which:      "plus" (default) or "minus"
//   extra_args: additional CLI flags forwarded to quad_to_nurbs.py
//               e.g. ["--subd", "2", "--tol", "0.001"]
message QuadToNurbsRequest {
  string          which      = 1;   // "plus" or "minus"  (default: "plus")
  repeated string extra_args = 2;
}

// Request a generated OBJ or STEP file.
//   which:  "plus" or "minus"  (default: "plus")
//   format: "obj" or "step"    (default: "step")
message NurbsFileRequest {
  string which  = 1;
  string format = 2;
}

// ─── Print preparation ───────────────────────────────────────────────────────

// Start gyroid_print_prep.py with optional extra CLI flags.
// Example extra_args: ["--num-workers", "4", "--max-bridge-length", "1.0"]
message PrintPrepRequest {
  repeated string extra_args = 1;
}

// Which generated file to download.
//   "build"     -> <stem>_build.stl     (mesh re-oriented into the build direction)
//   "overhang"  -> <stem>_overhang.stl  (downskin/overhang surface)
//   "supports"  -> <stem>_supports.stl  (generated support structures)
// Defaults to "build" when empty.
message PrintPrepFileRequest {
  string which = 1;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service GyroidOptimizer {
  // ── Config ─────────────────────────────────────────────────────────────────

  // Return the current gyroid_case_config.yaml content.
  rpc GetConfig (Empty) returns (ConfigResponse);

  // Overwrite the entire config file.
  rpc SetConfig (SetConfigRequest) returns (StatusResponse);

  // Patch individual fields by dot-notation key (preserves unmentioned values
  // but discards YAML comments).
  rpc PatchConfig (PatchConfigRequest) returns (StatusResponse);

  // ── Run control ────────────────────────────────────────────────────────────

  // Start gyroid_case_wrapper.py (error if already running).
  rpc StartRun (StartRunRequest) returns (StatusResponse);

  // Send SIGTERM to the running process (SIGKILL after 10 s).
  rpc StopRun (Empty) returns (StatusResponse);

  // Query the current process state.
  rpc GetRunStatus (Empty) returns (RunStatusResponse);

  // ── Monitoring ─────────────────────────────────────────────────────────────

  // Server-streaming: replay buffered output, then tail live output.
  // Terminates when the run finishes or the client disconnects.
  rpc StreamOutput (Empty) returns (stream OutputLine);

  // ── Results ────────────────────────────────────────────────────────────────

  // Return all rows of app/gyroid_opt_history.txt.
  rpc GetHistory (Empty) returns (HistoryResponse);

  // Return only the most-recent row of the history file.
  rpc GetLatestMetrics (Empty) returns (LatestMetricsResponse);

  // ── File access ────────────────────────────────────────────────────────────

  // List files under app/ (or a subdirectory).
  rpc ListFiles (ListFilesRequest) returns (FileListResponse);

  // Stream a single file or a .tar.gz of a directory.
  rpc DownloadFile (DownloadRequest) returns (stream FileChunk);

  // ── STL export ─────────────────────────────────────────────────────────────

  // Start gyroid_to_stl.py (error if already running).
  rpc StartStlExport (StlExportRequest) returns (StatusResponse);

  // Send SIGTERM to the STL export process (SIGKILL after 10 s).
  rpc StopStlExport (Empty) returns (StatusResponse);

  // Query the STL export process state.
  rpc GetStlStatus (Empty) returns (RunStatusResponse);

  // Server-streaming: replay buffered STL-export output, then tail live output.
  rpc StreamStlOutput (Empty) returns (stream OutputLine);

  // Download a generated STL file (or all of them as a .tar.gz).
  rpc DownloadStl (StlFileRequest) returns (stream FileChunk);

  // ── Gyroid → quad mesh ─────────────────────────────────────────────────────

  // Start gyroid_to_quad_mesh_qf.py (error if already running).
  rpc StartGyroidToQuadMesh (QuadMeshRequest) returns (StatusResponse);

  // Send SIGTERM to the quad-mesh process (SIGKILL after 10 s).
  rpc StopGyroidToQuadMesh (Empty) returns (StatusResponse);

  // Query the quad-mesh process state.
  rpc GetGyroidToQuadMeshStatus (Empty) returns (RunStatusResponse);

  // Server-streaming: replay buffered output, then tail live output.
  rpc StreamGyroidToQuadMeshOutput (Empty) returns (stream OutputLine);

  // ── Quad mesh → NURBS STEP ─────────────────────────────────────────────────

  // Start quad_to_nurbs.py for a specific gyroid sheet (error if already running).
  rpc StartQuadToNurbs (QuadToNurbsRequest) returns (StatusResponse);

  // Send SIGTERM to the quad-to-NURBS process (SIGKILL after 10 s).
  rpc StopQuadToNurbs (Empty) returns (StatusResponse);

  // Query the quad-to-NURBS process state.
  rpc GetQuadToNurbsStatus (Empty) returns (RunStatusResponse);

  // Server-streaming: replay buffered output, then tail live output.
  rpc StreamQuadToNurbsOutput (Empty) returns (stream OutputLine);

  // Download a generated OBJ (quad mesh) or STEP (NURBS) file.
  rpc DownloadNurbsFile (NurbsFileRequest) returns (stream FileChunk);

  // ── Print preparation ──────────────────────────────────────────────────────

  // Start gyroid_print_prep.py (error if already running).
  rpc StartPrintPrep (PrintPrepRequest) returns (StatusResponse);

  // Send SIGTERM to the print-prep process (SIGKILL after 10 s).
  rpc StopPrintPrep (Empty) returns (StatusResponse);

  // Query the print-prep process state.
  rpc GetPrintPrepStatus (Empty) returns (RunStatusResponse);

  // Server-streaming: replay buffered output, then tail live output.
  rpc StreamPrintPrepOutput (Empty) returns (stream OutputLine);

  // Download a generated build/overhang/supports STL file.
  rpc DownloadPrintPrepFile (PrintPrepFileRequest) returns (stream FileChunk);
}
